[project]
name = "PPRCheat"
version = "0.9.5"
description = "README.md"
authors = [{name = "BEJlYA", email = "illyabelskiy2002@gmail.com"}]
dependencies = [
    "flet>=1.1.2",
    "flet_notifications>=1.1.2",
    "aiohttp>=3.14.5",
    "uaforger @ git+https://github.com/sarperavci/uaforge.git"
]

[tool.flet.icons]
android = "assets/icon.png"
windows = "assets/icon.png"

[tool.flet.android]
res_dir = "assets/android_res"
adaptive_icon_background = "#FFFFFF"

[tool.flet.android.permission]
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService"]
exported = false
foregroundServiceType = "dataSync"

[tool.flet.android.manifest_application]
allowBackup = "false"
fullBackupContent = "false"

[tool.flet.windows.app]
hide_window_on_start = true

[tool.flet]
org = "com.belisor"
product = "PPRCheat"
company = "Belisor"
copyright = "Copyright © 2026 by Belisor"
build_number = 1
compile.app = true
compile.packages = true

[tool.flet.app]
path = "."
exclude = [
    ".idea",
    ".venv",
    "venv",
    "logs",
    "__pycache__",
    "build",
    ".flet",
    ".git",
    "*.pyc",
    ".data_parser",
    ".gitignore",
    "inno_setup",
    "pyproject.toml",
    "build.bat",
    "LICENSE.txt",
    "EULA_RU.txt",
    "EULA_ENG.txt",
    "PPRCheat.apk",
    "PPRCheat.exe",
    "README.md",
    "user_data",
    "assets/gui"
]